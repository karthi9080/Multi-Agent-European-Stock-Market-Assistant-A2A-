[project]
name = "a2a-karthikeyan-agent-langgraph"
version = "0.1.0"
description = "Karthikeyan's LangGraph stock market index agent, served over the A2A Protocol"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "a2a-sdk>=0.2.5,<0.3.0",
    "httpx>=0.28.1",
    # >=3 is needed for Gemini 3.x "thought signatures" on tool calls
    "langchain-google-genai>=4.0",
    "langgraph>=1.0",
    "pydantic>=2.10.6",
    "python-dotenv>=1.1.0",
    "uvicorn>=0.34.2",
    "langchain-core",
    "yfinance>=0.2.54",
]

[tool.hatch.build.targets.wheel]
packages = ["app"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = ["pytest>=8.0", "pytest-asyncio>=0.24"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
addopts = "--import-mode=importlib"
pythonpath = ["."]
markers = ["live: hits the real Yahoo Finance API (needs internet)"]
